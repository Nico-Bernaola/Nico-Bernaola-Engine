<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nico Bernaola Engine</title>
  <link rel="stylesheet" href="/static/globals.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#bfa159',
            'gold-light': '#d4b87a',
            'bg-dark': '#1b1b1b',
            'bg-light': '#f6f0eb',
          },
          fontFamily: {
            heading: ['Plus Jakarta Sans', 'sans-serif'],
            body: ['Poppins', 'sans-serif'],
          },
        },
      },
    }

    document.getElementById('stopBtn').addEventListener('click', async () => {
      if (!confirm('Apagar el servidor?')) return;
      try { await fetch('/shutdown', { method: 'POST' }); } catch (e) {}
      document.getElementById('status').textContent = 'Servidor apagado. Cerra esta pestana.';
      alert('Servidor apagado. Podes cerrar esta pestana.');
    });
  </script>
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    .dropzone.dragover { border-color: #bfa159; background: rgba(191,161,89,0.08); }
    .console { font-family: 'Consolas', 'Courier New', monospace; font-size: 12px; }
  </style>
</head>
<body class="bg-[#1b1b1b] text-[#b2b2b2] min-h-screen">
  <div class="container mx-auto px-6 py-10 max-w-5xl">
    <header class="mb-10">
      <span class="gold-line"></span>
      <h1 class="heading text-4xl font-extrabold text-[#f0ece6]">Nico Bernaola Engine</h1>
      <p class="text-[#b2b2b2] mt-2">Meeting inference — transcribe, summarize, extract key moments.</p>
    </header>

    <!-- Upload -->
    <section class="card-dark rounded-lg p-6 mb-6">
      <h2 class="heading text-xl font-semibold text-[#f0ece6] mb-4">1. Input</h2>
      <div id="dropzone" class="dropzone border-2 border-dashed border-[#2e2e2e] rounded-lg p-8 text-center cursor-pointer transition">
        <p class="text-[#f0ece6] font-medium">Drag & drop video(s) or a folder here</p>
        <p class="text-sm mt-1">or click to select</p>
        <input id="fileInput" type="file" multiple accept="video/*,.mp3,.wav,.m4a" class="hidden" />
        <input id="dirInput" type="file" webkitdirectory directory multiple class="hidden" />
      </div>
      <div class="flex gap-3 mt-4">
        <button id="btnFiles" class="btn-outline">Select files</button>
        <button id="btnFolder" class="btn-outline">Select folder</button>
      </div>
      <ul id="fileList" class="mt-4 text-sm text-[#f0ece6] space-y-1"></ul>
    </section>

    <!-- Modules -->
    <section class="card-dark rounded-lg p-6 mb-6">
      <h2 class="heading text-xl font-semibold text-[#f0ece6] mb-4">2. Modules</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <label class="flex items-center gap-2"><input type="checkbox" name="mod" value="split" class="accent-[#bfa159]" /> Split (audio/video)</label>
        <label class="flex items-center gap-2"><input type="checkbox" name="mod" value="transcribe" checked class="accent-[#bfa159]" /> Transcribe (Whisper)</label>
        <label class="flex items-center gap-2"><input type="checkbox" name="mod" value="infer" checked class="accent-[#bfa159]" /> Infer (meeting summary)</label>
        <label class="flex items-center gap-2"><input type="checkbox" name="mod" value="clips" class="accent-[#bfa159]" /> Key Moments (clipper)</label>
        <label class="flex items-center gap-2"><input type="checkbox" name="mod" value="cut" class="accent-[#bfa159]" /> Silence Cut (legacy)</label>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
        <div>
          <label class="block text-sm mb-1">Silence preset</label>
          <select id="silencePreset" class="w-full bg-[#1b1b1b] border border-[#2e2e2e] text-[#f0ece6] rounded px-3 py-2">
            <option value="1">1 — Podcast</option>
            <option value="2" selected>2 — Talking-Head</option>
            <option value="3">3 — Short-form</option>
          </select>
        </div>
      </div>

      <div class="flex items-center gap-6 mt-4 text-sm">
        <label class="flex items-center gap-2"><input type="checkbox" id="clipSequence" class="accent-[#bfa159]" /> Clip sequence (silence cut)</label>
        <label class="flex items-center gap-2"><input type="checkbox" id="exportClips" class="accent-[#bfa159]" /> Export video clips (key moments)</label>
      </div>
    </section>

    <!-- Run -->
    <section class="card-dark rounded-lg p-6 mb-6">
      <div class="flex items-center gap-4">
        <button id="runBtn" class="btn-primary">Run pipeline</button>
        <button id="stopBtn" class="btn-outline">Apagar servidor</button>
        <span id="status" class="text-sm"></span>
      </div>
    </section>

    <!-- Console -->
    <section class="card-dark rounded-lg p-6 mb-6">
      <h2 class="heading text-xl font-semibold text-[#f0ece6] mb-4">Console</h2>
      <pre id="console" class="console bg-[#141414] border border-[#2e2e2e] rounded p-4 h-72 overflow-auto whitespace-pre-wrap text-[#d4b87a]"></pre>
    </section>

    <!-- Downloads -->
    <section class="card-dark rounded-lg p-6">
      <h2 class="heading text-xl font-semibold text-[#f0ece6] mb-4">Outputs</h2>
      <ul id="downloads" class="space-y-2 text-sm"></ul>
    </section>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const dirInput = document.getElementById('dirInput');
    const fileList = document.getElementById('fileList');
    let uploadedPaths = [];

    function addFiles(files) {
      const arr = Array.from(files);
      if (!arr.length) return;
      const fd = new FormData();
      arr.forEach(f => fd.append('files', f));
      fetch('/upload', { method: 'POST', body: fd })
        .then(r => r.json())
        .then(data => {
          uploadedPaths = uploadedPaths.concat(data.paths);
          renderFileList(data.names);
        });
    }

    function renderFileList(names) {
      names.forEach(n => {
        const li = document.createElement('li');
        li.textContent = '• ' + n;
        fileList.appendChild(li);
      });
    }

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('dragover'); addFiles(e.dataTransfer.files); });
    fileInput.addEventListener('change', e => addFiles(e.target.files));
    document.getElementById('btnFiles').addEventListener('click', () => fileInput.click());
    document.getElementById('btnFolder').addEventListener('click', () => dirInput.click());
    dirInput.addEventListener('change', e => addFiles(e.target.files));

    const consoleEl = document.getElementById('console');
    function log(line) {
      consoleEl.textContent += line + '\n';
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    document.getElementById('runBtn').addEventListener('click', async () => {
      if (!uploadedPaths.length) { alert('Upload at least one file first.'); return; }
      const modules = Array.from(document.querySelectorAll('input[name="mod"]:checked')).map(c => c.value);
      const payload = {
        files: uploadedPaths,
        modules,
        silence_preset: document.getE
        silence_preset: document.getElementById('silencePreset').value,
        clip_sequence: document.getElementById('clipSequence').checked,
        export_clips: document.getElementById('exportClips').checked,
      };
      consoleEl.textContent = '';
      document.getElementById('downloads').innerHTML = '';
      document.getElementById('status').textContent = 'Running...';
      const r = await fetch('/run', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const { job_id } = await r.json();

      const es = new EventSource(`/logs/${job_id}`);
      es.onmessage = (ev) => {
        if (ev.data === '[DONE]') {
          es.close();
          document.getElementById('status').textContent = 'Done.';
          fetch(`/outputs_list/${job_id}`).then(r=>r.json()).then(data => {
            const ul = document.getElementById('downloads');
            data.files.forEach(f => {
              const li = document.createElement('li');
              const a = document.createElement('a');
              a.href = f.url;
              a.textContent = f.name;
              a.className = 'text-gold hover:text-gold-light underline';
              a.download = f.name;
              li.appendChild(a);
              ul.appendChild(li);
            });
          });
          return;
        }
        log(ev.data);
      };
      es.onerror = () => { es.close(); document.getElementById('status').textContent = 'Error/finished.'; };
    });
  </script>
</body>
</html>
